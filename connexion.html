<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - YoungReady</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>YoungReady</h1>

        <input
            type="email"
            id="email"
            placeholder="Adresse e-mail"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Mot de passe"
            required
        >

        <button id="btnConnexion">
            Se connecter
        </button>

        <p id="message"></p>

    </div>


    <script type="module">

        import { auth } from "./firebase-config.js";

        import {
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


        const email =
            document.getElementById("email");

        const password =
            document.getElementById("password");

        const btnConnexion =
            document.getElementById("btnConnexion");

        const message =
            document.getElementById("message");


        btnConnexion.addEventListener("click", async () => {

            message.textContent =
                "Connexion en cours...";

            btnConnexion.disabled = true;


            try {

                await signInWithEmailAndPassword(
                    auth,
                    email.value.trim(),
                    password.value
                );

                message.textContent =
                    "Connexion réussie !";

                window.location.href =
                    "Admin.html";


            } catch (error) {

                console.error(
                    "Erreur Firebase :",
                    error
                );

                message.textContent =
                    "Erreur : e-mail ou mot de passe incorrect.";

                btnConnexion.disabled = false;

            }

        });

    </script>

</body>

</html>
